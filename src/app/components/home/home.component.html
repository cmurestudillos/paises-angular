<!-- Loading skeletons -->
<div *ngIf="cargando" class="paises-grid">
  <p-card *ngFor="let i of skeletonArray" styleClass="pais-card">
    <ng-template pTemplate="header">
      <p-skeleton height="160px" borderRadius="0" styleClass="flag-skeleton"></p-skeleton>
    </ng-template>
    <ng-template pTemplate="title">
      <p-skeleton width="75%" height="1.2rem"></p-skeleton>
    </ng-template>
    <ng-template pTemplate="subtitle">
      <p-skeleton width="55%" height="0.9rem" styleClass="mt-1"></p-skeleton>
    </ng-template>
    <ng-template pTemplate="content">
      <div class="pais-tags">
        <p-skeleton width="70px" height="1.6rem" borderRadius="1rem"></p-skeleton>
        <p-skeleton width="60px" height="1.6rem" borderRadius="1rem"></p-skeleton>
        <p-skeleton width="65px" height="1.6rem" borderRadius="1rem"></p-skeleton>
      </div>
    </ng-template>
  </p-card>
</div>

<!-- Error -->
<div *ngIf="error" class="error-container">
  <i class="pi pi-exclamation-circle error-icon"></i>
  <p>{{ error }}</p>
</div>

<!-- Filtros -->
<div *ngIf="!cargando && !error" class="filtros-bar">
  <div class="search-wrapper">
    <i class="pi pi-search search-icon"></i>
    <input
      pInputText
      type="text"
      [(ngModel)]="terminoBusqueda"
      (ngModelChange)="aplicarFiltros()"
      placeholder="Buscar país o capital..."
      class="search-input" />
  </div>
  <p-dropdown
    [options]="regiones"
    [(ngModel)]="regionSeleccionada"
    (ngModelChange)="aplicarFiltros()"
    placeholder="Todas las regiones"
    [showClear]="true"
    styleClass="region-dropdown">
  </p-dropdown>
  <p-button
    label="Limpiar"
    icon="pi pi-times"
    severity="secondary"
    [outlined]="true"
    (onClick)="limpiarFiltros()"
    [disabled]="!terminoBusqueda && !regionSeleccionada">
  </p-button>
  <span class="resultado-contador">
    <strong>{{ totalPaisesMostrados }}</strong> / {{ paises.length }} países
  </span>
</div>

<!-- Sin resultados -->
<div *ngIf="!cargando && !error && paisesFiltrados.length === 0" class="no-resultados">
  <i class="pi pi-globe no-resultados-icon"></i>
  <h3>No se encontraron países</h3>
  <p>Intenta con otros términos o cambia los filtros.</p>
  <p-button label="Limpiar filtros" icon="pi pi-redo" (onClick)="limpiarFiltros()"></p-button>
</div>

<!-- Grid de países -->
<div *ngIf="!cargando && !error && paisesFiltrados.length > 0" class="paises-grid">
  <p-card *ngFor="let pais of paisesFiltrados" styleClass="pais-card">
    <ng-template pTemplate="header">
      <img
        [src]="pais.flags.svg"
        [alt]="pais.flags.alt || pais.name.common"
        class="pais-flag"
        onerror="this.src = 'assets/img/flag-placeholder.png'" />
    </ng-template>
    <ng-template pTemplate="title">{{ pais.name.common }}</ng-template>
    <ng-template pTemplate="subtitle">{{ pais.name.official }}</ng-template>
    <ng-template pTemplate="content">
      <div class="pais-tags">
        <span *ngIf="pais.capital && pais.capital.length" class="badge badge-capital">
          <i class="pi pi-building"></i>{{ pais.capital[0] }}
        </span>
        <span class="badge badge-pop">
          <i class="pi pi-users"></i>{{ formatPoblacion(pais.population) }}
        </span>
        <span class="badge badge-region">
          <i class="pi pi-globe"></i>{{ pais.region }}
        </span>
        <span class="badge badge-code">{{ pais.cca3 }}</span>
      </div>
    </ng-template>
  </p-card>
</div>
